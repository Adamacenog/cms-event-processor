name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CI: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore CmsEventProcessor.slnx --locked-mode
      - name: Restore pinned migration tooling
        run: dotnet tool restore
      - name: Verify formatting
        run: dotnet format CmsEventProcessor.slnx --verify-no-changes --no-restore
      - name: Release build
        run: dotnet build CmsEventProcessor.slnx --configuration Release --no-restore
      - name: Unit and HTTP integration tests
        run: dotnet test CmsEventProcessor.slnx --configuration Release --no-build --no-restore --filter "Category!=Sql" --logger trx --results-directory artifacts/test-results --collect "XPlat Code Coverage"
      - name: Real SQL Server integration tests
        if: runner.os == 'Linux'
        run: dotnet test CmsEventProcessor.IntegrationTests/CmsEventProcessor.IntegrationTests.csproj --configuration Release --no-build --no-restore --filter "Category=Sql" --logger trx --results-directory artifacts/test-results --collect "XPlat Code Coverage"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: warn

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pinned runtime image
        run: docker build --tag cms-event-processor:${{ github.sha }} .
